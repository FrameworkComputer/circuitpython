# Build MCUboot and sign the application for it. Daisy ships with MCUboot in
# RRAM and prj.conf links the application at zephyr,code-partition, which the
# board points at slot0 -- so without this the image lands at 0x18000 unsigned
# and the bootloader already on the hardware refuses to start it.
#
# Everything about *how* MCUboot is built for this hardware (single slot,
# ED25519 prehashed, the recovery configuration) is a property of the board and
# comes from the board's own Kconfig.sysbuild and sysbuild.cmake, which sysbuild
# picks up on its own. This line is the whole opt-in.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
