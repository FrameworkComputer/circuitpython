CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USBD_MSC_CLASS=n
CONFIG_USBD_HID_SUPPORT=n
# Minimal logging: driver and diagnostic warnings go straight to the console.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_PWM=y
# Fan tachometer (NPCX TACH driver is a sensor driver).
CONFIG_SENSOR=y
# Board-ID, PSYS, adapter-current and battery-temperature channels (adc.c).
CONFIG_ADC=y
# busio currently compiles all three bus implementations, including for UART.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_I2S=n
CONFIG_ENTROPY_GENERATOR=n
CONFIG_MBEDTLS=n
CONFIG_MBEDTLS_BUILTIN=n
CONFIG_PSA_CRYPTO=n
CONFIG_PSA_WANT_ALG_SHA_1=n
CONFIG_PSA_WANT_ALG_SHA_256=n
CONFIG_NVS=n
CONFIG_SETTINGS_NVS=n
CONFIG_MAIN_STACK_SIZE=8192
# Heartbeat and fan/thermal monitor (I2C, tach) run on the system work queue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_ARCH_POSIX_UPDATE_STACK_INFO=n
CONFIG_NET_HOSTNAME_ENABLE=n
CONFIG_NET_HOSTNAME_DYNAMIC=n
# eSPI host interface as stock ec-lilac program.conf; peripherals (ACPI host
# I/O, host command, ACPI SHM, 8042, Port 80, custom opcode) default on.
CONFIG_ESPI=y
CONFIG_ESPI_NPCX_PERIPHERAL_ACPI_SHD_MEM_SIZE=512
CONFIG_ESPI_PERIPHERAL_ACPI_SHM_REGION_PORT_NUM=0xe00
CONFIG_ESPI_NPCX_PERIPHERAL_DEBUG_PORT_80_MULTI_BYTE=y
